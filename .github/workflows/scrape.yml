name: Nightly indicator scrape

# One scheduled run per day at 23:00 UTC (midnight BST in summer, 11pm GMT in
# winter). There used to be a second cron plus a guard step that only let the
# run through if it started at exactly 00:xx Europe/London - but GitHub starts
# scheduled workflows late when it's busy (often by 1-4 hours), so the guard
# skipped *every* run and reported success. A daily run that's sometimes late
# is far better than one that silently never happens. (The Google Cloud
# deployment uses Cloud Scheduler, which is time-zone aware and fires on time.)
on:
  schedule:
    - cron: "0 23 * * *"
  workflow_dispatch: {}

# Never let two scrapes overlap (e.g. a manual run during the scheduled one).
concurrency:
  group: nightly-scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    # 179 tracked countries at a polite ~3s delay between requests takes a
    # while on its own; generous headroom for the personality step too.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: scraper/requirements.txt

      - name: Install dependencies
        working-directory: scraper
        run: pip install -r requirements.txt

      - name: Run scraper
        working-directory: scraper
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python scrape.py

      - name: Generate market personalities
        # Deterministic scoring needs no API key; allowed to fail without
        # marking the (more important) scrape above as broken.
        continue-on-error: true
        working-directory: scraper
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python insights.py
