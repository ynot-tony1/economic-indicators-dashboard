name: Nightly indicator scrape

# One scheduled run per day at 01:30 UTC (01:30 GMT / 02:30 BST). Snapshots are
# keyed on the Europe/London calendar day, so a run must land inside the day it
# belongs to: 01:30 UTC does, in summer and winter, even when GitHub starts it
# hours late (it often does under load). Retries and reruns on the same day
# update that day's snapshot rather than adding another.
#
# History: there used to be two crons plus a guard that only proceeded if the
# job *started* at 00:xx London time - GitHub's start delays made it skip every
# run while reporting success. A daily run that's sometimes late is far better
# than one that silently never happens. (The Google Cloud deployment uses Cloud
# Scheduler, which is time-zone aware and fires on time.)
on:
  schedule:
    - cron: "30 1 * * *"
  workflow_dispatch: {}

# Never let two scrapes overlap (e.g. a manual run during the scheduled one).
concurrency:
  group: nightly-scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    # 179 tracked countries at a polite ~3s delay between requests takes a
    # while on its own; generous headroom for the personality step too.
    timeout-minutes: 90
    env:
      # libpq's sslmode=verify-full looks for ~/.postgresql/root.crt by default,
      # which the runner doesn't have; point it at the system CA bundle so
      # certificate verification stays fully on.
      PGSSLROOTCERT: /etc/ssl/certs/ca-certificates.crt
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: scraper/requirements.txt

      - name: Install dependencies
        working-directory: scraper
        run: pip install -r requirements.txt

      - name: Run scraper
        working-directory: scraper
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python scrape.py

      - name: Generate market personalities
        # Deterministic scoring needs no API key; allowed to fail without
        # marking the (more important) scrape above as broken.
        continue-on-error: true
        working-directory: scraper
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python insights.py
